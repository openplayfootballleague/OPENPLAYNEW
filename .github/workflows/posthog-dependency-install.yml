name: Install PostHog SDK dependencies

on:
  push:
    branches:
      - feat/visual-system-refresh-2026-11-08
    paths:
      - .github/workflows/posthog-dependency-install.yml

permissions:
  contents: write

jobs:
  install:
    if: github.ref == 'refs/heads/feat/visual-system-refresh-2026-11-08'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the official PostHog TanStack Start SDK packages
        run: npm install @posthog/react posthog-node --save --no-audit --no-fund
      - name: Commit the package manifest and lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "PostHog packages are already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: install PostHog SDK packages"
          git push origin "HEAD:${BRANCH_NAME}"
