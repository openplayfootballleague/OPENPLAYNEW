name: Player account retention

# Manual-only until advance-warning emails and controlled staging acceptance are complete.
on:
  workflow_dispatch:

concurrency:
  group: player-account-retention
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-inactive-player-accounts:
    runs-on: ubuntu-latest
    steps:
      - name: Process inactivity closures and expired archives
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ACCOUNT_RETENTION_CRON_SECRET: ${{ secrets.ACCOUNT_RETENTION_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" || -z "$ACCOUNT_RETENTION_CRON_SECRET" ]]; then
            echo "::error::Configure SUPABASE_URL, SUPABASE_ANON_KEY and ACCOUNT_RETENTION_CRON_SECRET repository secrets before enabling account retention."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "$SUPABASE_URL/functions/v1/player-account-retention" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Content-Type: application/json" \
            --header "x-account-retention-secret: $ACCOUNT_RETENTION_CRON_SECRET" \
            --data '{"action":"process-inactivity"}'
