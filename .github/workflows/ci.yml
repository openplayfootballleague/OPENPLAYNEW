name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/deliver-notifications/index.ts
      - name: Run domain tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npx wrangler deploy --dry-run
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test
