name: Build verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright for analytics browser acceptance
        if: ${{ hashFiles('tests/e2e/analytics-consent.spec.ts') != '' }}
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium for analytics browser acceptance
        if: ${{ hashFiles('tests/e2e/analytics-consent.spec.ts') != '' }}
        run: npx playwright install --with-deps chromium
      - name: Run analytics browser consent acceptance
        if: ${{ hashFiles('tests/e2e/analytics-consent.spec.ts') != '' }}
        run: npx playwright test --config=playwright.config.ts
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/deliver-notifications/index.ts supabase/functions/create-player-checkout/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/public-gallery/index.ts
      - name: Run domain tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npx wrangler deploy --dry-run
