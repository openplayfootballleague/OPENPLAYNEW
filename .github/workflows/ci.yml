name: Build verification

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push creates a PR check; serialize the local Supabase database replay
# so concurrent attempts cannot contend for the same Docker host ports.
concurrency:
  group: openplay-phase1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify canonical migration source manifest
        run: npm run verify:migration-sources
      - name: Verify generated migrations receive their canonical SQL drafts
        run: npm run verify:ci-migration-generation
      - name: Verify Edge Function security configuration
        run: node scripts/verify-edge-function-security.mjs
      - name: Verify player navigation specification
        run: node scripts/verify-player-navigation.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/deliver-notifications/index.ts supabase/functions/create-player-checkout/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/public-gallery/index.ts supabase/functions/guardian-consent/index.ts supabase/functions/player-account-retention/index.ts supabase/functions/create-referee-connect-account/index.ts supabase/functions/pay-referee-payout/index.ts supabase/functions/referee-connect-webhook/index.ts supabase/functions/create-team-fixture-checkout/index.ts supabase/functions/team-stripe-webhook/index.ts supabase/functions/process-team-payment-deadlines/index.ts supabase/functions/process-referee-payout-queue/index.ts supabase/functions/admin-postpone-gameweek/index.ts supabase/functions/admin-product-analytics/index.ts
      - name: Test Stripe Connect webhook signature verification
        run: deno test --node-modules-dir=auto supabase/functions/referee-connect-webhook/signature_test.ts supabase/functions/pay-referee-payout/stripe-transfer-policy_test.ts supabase/functions/admin-product-analytics/policy_test.ts
      - name: Run domain tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npx wrangler deploy --dry-run

  analytics-consent-browser:
    name: PostHog consent and network acceptance
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Create isolated Playwright package workspace
        run: mkdir -p /tmp/openplay-playwright
      - name: Install isolated Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
        working-directory: /tmp/openplay-playwright
      - name: Link isolated Playwright runner into the application workspace
        run: mkdir -p node_modules/@playwright node_modules/.bin && ln -sfn /tmp/openplay-playwright/node_modules/@playwright/test node_modules/@playwright/test && ln -sfn /tmp/openplay-playwright/node_modules/playwright node_modules/playwright && ln -sfn /tmp/openplay-playwright/node_modules/playwright-core node_modules/playwright-core && ln -sfn /tmp/openplay-playwright/node_modules/.bin/playwright node_modules/.bin/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run consent and network acceptance tests
        run: npx playwright test --config=playwright.analytics.config.ts

  database-replay:
    name: Clean Supabase migration replay and security assertions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start isolated local Supabase database
        run: supabase start -x studio,edge-runtime,logflare,vector
      - name: Generate referee application migration using the pinned Supabase CLI
        run: |
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_referee_application_workflow.sql' -print -quit)"
          if [ -z "$migration_file" ]; then
            # Supabase CLI versions migrations to the nearest second; keep generated versions unique.
            sleep 1
            supabase migration new referee_application_workflow
            migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_referee_application_workflow.sql' -print -quit)"
            cp supabase/drafts/referee_application_workflow.sql "$migration_file"
          else
            diff -u supabase/drafts/referee_application_workflow.sql "$migration_file"
          fi
          test -n "$migration_file"
          printf '%s\n' "$migration_file"
      - name: Generate referee fixture assignment migration using the pinned Supabase CLI
        run: |
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_referee_fixture_assignments.sql' -print -quit)"
