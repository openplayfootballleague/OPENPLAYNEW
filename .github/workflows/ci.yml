name: Build verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify canonical migration source manifest
        run: npm run verify:migration-sources
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/deliver-notifications/index.ts supabase/functions/create-player-checkout/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/public-gallery/index.ts
      - name: Run domain tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npx wrangler deploy --dry-run

  database-replay:
    name: Clean Supabase migration replay and security assertions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start isolated local Postgres database
        run: supabase db start
      - name: Replay every migration against a clean local database
        run: supabase db reset --local --no-seed
      - name: Verify profile and avatar privilege assertions
        run: supabase db query --local --file supabase/tests/profile_avatar_only_permissions.sql
      - name: Verify database security assertions
        run: node scripts/verify-security-assertions.mjs
      - name: Stop local Supabase database
        if: always()
        run: supabase stop --no-backup
