            supabase migration new finance_operating_costs_and_business_performance
            migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_finance_operating_costs_and_business_performance.sql' -print -quit)"
            cp supabase/drafts/finance_operating_costs_and_business_performance.sql "$migration_file"
          else
            diff -u supabase/drafts/finance_operating_costs_and_business_performance.sql "$migration_file"
          fi
          test -n "$migration_file"
          grep -qxF "$(basename "$migration_file")" scripts/expected-pending-migrations.txt || printf '%s\n' "$(basename "$migration_file")" >> scripts/expected-pending-migrations.txt
          sort -u -o scripts/expected-pending-migrations.txt scripts/expected-pending-migrations.txt
          printf '%s\n' "$migration_file"
      - name: Verify unique migration versions before replay
        shell: bash
        run: |
          versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | cut -c1-14 | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          if [ -n "$duplicates" ]; then
            printf 'Duplicate migration version(s):\n%s\n' "$duplicates"
            exit 1
          fi
      - name: Replay every migration against a clean local database
        run: supabase db reset --local --no-seed
      - name: Verify pending migrations after the applied hosted baseline
        run: node scripts/verify-hosted-migration-order.mjs
      - name: Set up Node.js for Auth lifecycle integration
