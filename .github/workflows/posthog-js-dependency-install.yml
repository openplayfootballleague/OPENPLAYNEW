name: Add direct PostHog JavaScript SDK dependency

on:
  push:
    branches:
      - feat/visual-system-refresh-2026-11-08

permissions:
  contents: write

jobs:
  install:
    if: github.ref == 'refs/heads/feat/visual-system-refresh-2026-11-08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the official PostHog browser SDK directly
        run: npm install posthog-js --save --no-audit --no-fund
      - name: Commit package manifest and lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "posthog-js is already a direct dependency."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add direct PostHog browser SDK dependency"
          git push origin "HEAD:${BRANCH_NAME}"
