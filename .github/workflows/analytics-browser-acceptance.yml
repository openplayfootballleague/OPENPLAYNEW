name: Analytics browser acceptance

on:
  pull_request:
    paths:
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "src/components/analytics-provider.tsx"
      - "src/lib/analytics/**"
      - "src/routes/__root.tsx"
      - "src/routes/more.tsx"
      - "src/routes/privacy-security.tsx"
      - "playwright.analytics.config.ts"
      - "vite.analytics-e2e.config.ts"
      - "tests/e2e/analytics-consent.spec.ts"
      - ".github/workflows/analytics-browser-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright test runner without changing project lockfile
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run consent and network acceptance tests
        run: npx playwright test --config=playwright.analytics.config.ts
