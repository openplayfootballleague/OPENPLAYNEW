name: Generate PostHog dependency lockfile

on:
  push:
    branches:
      - feat/openplay-integrated-application-2026-11-08
    paths:
      - .github/workflows/posthog-dependency-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile with official PostHog packages
        run: npm install @posthog/react posthog-js posthog-node --save --no-audit --no-fund
      - name: Commit lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "PostHog lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: generate PostHog SDK lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
